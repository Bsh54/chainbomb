[package]
name = "chainbomb"
version = "0.1.0"
description = "CHAINBOMB on-chain arena"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "chainbomb"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
